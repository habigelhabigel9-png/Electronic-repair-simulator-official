<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Electronics Repair Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#15181c;--pn:#23282e;--pn2:#2e353d;--tx:#dfe6ec;--mu:#8b97a3;--cy:#27d3e6;--or:#ff9a2e;--rd:#ff4d4d;--gn:#3ddc84;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#2b323a,#15181c 70%) var(--bg);color:var(--tx);font:15px/1.45 "Trebuchet MS",system-ui,sans-serif;min-height:100%}
#app{max-width:760px;margin:auto;padding:10px}
h1,h2,h3{margin:.3em 0;font-family:"Courier New",monospace}
.logo{color:var(--cy);letter-spacing:2px;line-height:1.15}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pn);padding:6px 10px;border-radius:10px;border-bottom:2px solid var(--cy)}
.card{background:var(--pn);border:1px solid #3a434c;border-radius:10px;padding:12px;margin:10px 0}
.c{text-align:center}.mu{color:var(--mu)}.cy{color:var(--cy);font-weight:700}.gn{color:var(--gn)}.rd{color:var(--rd)}.or{color:var(--or)}
.msg{background:#3a2a12;border-left:4px solid var(--or);padding:8px 10px;margin:8px 0;border-radius:6px}
button{background:var(--pn2);color:var(--tx);border:1px solid #4a5560;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;min-height:44px}
button:hover:not(:disabled),button:focus-visible{border-color:var(--cy);outline:none}button:disabled{opacity:.35;cursor:default}
.pri{background:#0e6f7a;border-color:var(--cy)}.dg{border-color:var(--rd);color:var(--rd)}
.col{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.lg{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
.ok{border-color:var(--gn);color:var(--gn)}.tab.on{background:#0e6f7a;border-color:var(--cy)}
.board{background:linear-gradient(135deg,#1c6a42,#134a2e);border:4px solid #0b2a1a;border-radius:12px;padding:4px}
.cp{cursor:pointer}.cp:focus{outline:none}.cp:focus .sel,.cp.s .sel{stroke:var(--cy);stroke-width:2}
.lcd{font-family:"Courier New",monospace;background:#a9d9a2;color:#12260f;padding:10px;border-radius:6px;min-height:44px;box-shadow:inset 0 0 8px #0006}
.bench{background:linear-gradient(#5a4430,#3d2d1f);border-radius:10px;padding:8px;border-top:4px solid #7a5d3f}
.bar2{height:10px;background:#111;border-radius:6px;overflow:hidden}.bar2>i{display:block;height:100%;background:var(--cy)}
table{width:100%;border-collapse:collapse}td{padding:5px 4px;border-bottom:1px solid #3a434c}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;background:#444;margin-right:6px}.led.g{background:var(--gn);box-shadow:0 0 8px var(--gn)}.led.r{background:var(--rd);box-shadow:0 0 8px var(--rd)}.led.o{background:var(--or)}
</style></head><body><div id="app"></div><script>
'use strict';
const $=s=>document.querySelector(s),SAVE='ers_save_v1';
// ---------- DATA ----------
const P={fuse2A:['Fuse 2A',6,'fuse',2],cap100:['Capacitor 100µF',5,'cap',100],cap470:['Capacitor 470µF',8,'cap',470],cap1000:['Capacitor 1000µF',12,'cap',1000],res220:['Resistor 220Ω',2,'res',220],res1k:['Resistor 1kΩ',2,'res',1000],res10k:['Resistor 10kΩ',2,'res',10000],d4007:['Diode 1N4007',4,'dio',0],q3904:['Transistor 2N3904',7,'trn',0],r7805:['Regulator 7805',11,'reg',0],i555:['Timer IC 555',18,'ic',0]};
const POOL=['fuse2A','d4007','cap470','res1k','q3904','r7805','cap100','res10k','d4007','cap1000','i555','res220'];
const PF={fuse:'F',cap:'C',res:'R',dio:'D',trn:'Q',reg:'U',ic:'U'};
const MODES={fuse:['open'],cap:['bulge','leaky'],res:['burnt','drift'],dio:['short','dopen'],trn:['short'],reg:['dead'],ic:['dead']};
const VIS={open:0,bulge:0,burnt:0,leaky:1,drift:1,dead:1,short:2,dopen:2};
const LOOK={open:'The glass is blackened and the filament is gone.',bulge:'The top is domed and leaking brown residue.',burnt:'The body is scorched black.',leaky:'A faint crust surrounds the seal.',drift:'The color bands are browned by heat.',dead:'The package is slightly discolored.',short:'',dopen:''};
const SYM={open:'Dead: no power at all',bulge:'Supply ripple: hum and flicker',leaky:'Supply ripple: hum and flicker',burnt:'Bias path open: no output',drift:'Output level wrong and distorted',short:'Overcurrent: protection trips',dopen:'Rail collapses under load',dead:'No activity from the chip'};
const DEV=[['Phone Charger','won’t charge any phone'],['Desk Lamp Dimmer','flickers, then dies'],['Portable Radio','is silent'],['USB Hub','drops every device'],['Game Controller','won’t power on'],['Bluetooth Speaker','hums and cuts out'],['Wi-Fi Router','keeps rebooting'],['Guitar Amplifier','is completely dead'],['Monitor Power Board','clicks but stays black'],['Drone Controller','shuts off mid-flight']];
const SK={eyes:['Sharp Eyes',1,'Subtle damage becomes visible on the board and in inspection.'],data:['Datasheet Library',1,'The multimeter shows the expected reading beside each measurement.'],haggle:['Haggler',3,'Parts cost 10% less per rank.'],pay:['Reputation',3,'Jobs pay 10% more per rank.']};
const RANKS=['Apprentice','Bench Tech','Repair Tech','Senior Tech','Master Tech','Legend'];
const TT={career:'Career',workshop:'Workshop',levels:'Level Selection',job:'Repair Job',inventory:'Inventory',shop:'Component Shop',skills:'Skill Tree',history:'Repair History',settings:'Settings',tutorial:'Tutorial',result:'Job Result'};
const sh=k=>P[k][0].split(' ').pop(),fmt=v=>v>=1000?(v/1000)+'k':''+Math.round(v);
// ---------- STATE ----------
let S,J=null,UI={screen:'menu',tab:'inspect',sel:null,msg:'',lcd:'',res:null,busy:0,done:null};
const def=()=>({xp:0,rep:0,money:200,done:{},inv:{},sk:{},sp:0,hist:[],set:{snd:true,hint:true},tut:0,job:null});
function load(){try{S=Object.assign(def(),JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){S=def()}J=S.job||null}
function save(){S.job=J;try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
let AC;function beep(f,d=.1){if(!S.set.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
// ---------- JOB GENERATION (deterministic per level) ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(id){
 const b=id[0]=='b',lv=+(b?id.slice(1):id),r=rng(lv*977+(b?31337:7)+SEED),n=Math.min(12,5+Math.floor((lv-1)/9)+(b?1:0));
 const pl=POOL.slice();for(let i=pl.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pl[i],pl[j]]=[pl[j],pl[i]]}
 const cnt={},comps=pl.slice(0,n).map(k=>{const t=P[k][2],p=PF[t];cnt[p]=(cnt[p]||0)+1;return{ref:p+cnt[p],req:k,has:k,type:t,mode:null,cold:false}});
 let cand=comps.filter(c=>lv>=3||['fuse','cap','res'].includes(c.type));
 if(!cand.length){const c=comps[0];c.req=c.has='fuse2A';c.type='fuse';c.ref='F9';cand=[c]}
 for(let i=cand.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
 const k=Math.min(cand.length,5,1+Math.floor((lv-1)/12)+(b?1:0));
 cand.slice(0,k).forEach(c=>{if(lv>=15&&r()<.25)c.cold=true;else if(lv>=5&&r()<.2)c.dirt=true;else{const m=MODES[c.type];c.mode=m[Math.floor(r()*m.length)]}});
 return{id,lv,bonus:b,dev:DEV[(lv-1+(b?3:0))%10],comps,mist:0,log:{}};
}
const gc=ref=>J&&J.comps.find(c=>c.ref===ref);
// ---------- DIAGNOSTICS ----------
function look0(c){if(!c.has)return'Empty pads, bare copper.';const t=[],m=c.mode,v=VIS[m];
 if(m&&(v==0||(v==1&&eyes())))t.push(LOOK[m]);if(c.cold&&eyes())t.push('The solder joints are dull and cracked.');
 if(c.dirt)t.push('Grime and corrosion coat the pins.');if(c.has!==c.req)t.push('Wrong marking. The board calls for '+sh(c.req)+'.');return t.length?t.join(' '):'Looks healthy.'}
function read0(c){const k=c.has;if(!k)return'No part: empty pads';if(c.cold||c.dirt)return'Unstable: flickers, then OL';const[,,t,v]=P[k],m=c.mode,j=1+((c.ref.charCodeAt(0)+c.ref.charCodeAt(1))%9-4)/100;
 if(t=='fuse')return m?'OL (open circuit)':'0.2 Ω continuity';
 if(t=='cap')return Math.round(v*(m=='bulge'?.3:m=='leaky'?.55:j))+' µF';
 if(t=='res')return m=='burnt'?'OL (open circuit)':fmt(v*(m=='drift'?1.8:j))+' Ω';
 if(t=='dio')return m=='short'?'0.00 V both ways (short)':m=='dopen'?'OL both ways (open)':'Fwd 0.58 V, reverse OL';
 if(t=='trn')return m=='short'?'C–E 0.4 Ω (short)':'B–E 0.65 V, C–E OL';
 if(t=='reg')return m?'Pins read 0.1 kΩ (internal fault)':'Pins read 1.2 kΩ';
 return m?'Pins read 0.1 kΩ (internal fault)':'Pins read 8.5 kΩ'}
function expect(c){const[,,t,v]=P[c.req];return{fuse:'under 1 Ω',cap:v+' µF ±20%',res:fmt(v)+' Ω ±5%',dio:'Fwd ≈0.6 V, reverse OL',trn:'C–E OL',reg:'≈1.2 kΩ',ic:'≈8.5 kΩ'}[t]}
// ---------- BOARD DRAWING ----------
function shape0(c){if(!c.has)return'';const t=c.type,m=c.mode,v=m&&(VIS[m]==0||(VIS[m]==1&&eyes()));
 if(t=='fuse')return`<rect x="14" y="26" width="52" height="16" rx="8" fill="${v?'#3a2e22':'#cfe4ee'}" stroke="#889"/>${v?'':'<path d="M22 34h36" stroke="#d9a441" stroke-width="2"/>'}`;
 if(t=='cap')return`<rect x="26" y="18" width="28" height="34" fill="#3b5bb0"/><ellipse cx="40" cy="${v?14:18}" rx="14" ry="${v?10:5}" fill="${v?'#7a5a2a':'#5d7fd6'}"/>`;
 if(t=='res')return`<rect x="18" y="28" width="44" height="14" rx="6" fill="${v?'#111':'#d8c28f'}"/>${v?'':'<path d="M30 28v14M38 28v14M46 28v14" stroke="#a33" stroke-width="3"/>'}`;
 if(t=='dio')return'<rect x="20" y="28" width="40" height="14" fill="#222"/><rect x="50" y="28" width="6" height="14" fill="#bbb"/>';
 if(t=='trn')return'<path d="M26 46A14 14 0 0 1 54 46z" fill="#222"/>';
 if(t=='reg')return`<rect x="22" y="22" width="36" height="26" fill="${v?'#4a3a30':'#222'}"/><rect x="22" y="16" width="36" height="6" fill="#999"/>`;
 return`<rect x="18" y="24" width="44" height="24" rx="2" fill="${v?'#4a3a30':'#222'}"/><path d="M24 20v4M32 20v4M40 20v4M48 20v4M56 20v4M24 48v4M32 48v4M40 48v4M48 48v4M56 48v4" stroke="#bbb" stroke-width="3"/>`}
function board(){const n=J.comps.length,rows=Math.ceil(n/4);
 return`<div class="board"><svg viewBox="0 0 360 ${rows*84+6}" width="100%" role="group" aria-label="Circuit board">`+J.comps.map((c,i)=>{
 const x=(i%4)*90+5,y=4+Math.floor(i/4)*84,pad=!c.has?'#c88b3a':(c.cold&&S.sk.eyes?'#777':'#e2e2e2');
 return`<g class="cp ${UI.sel==c.ref?'s':''}" data-act="pick" data-a="${c.ref}" tabindex="0" role="button" aria-label="${c.ref} ${sh(c.req)}" transform="translate(${x} ${y})"><rect class="sel" width="80" height="78" rx="6" fill="#0003" stroke="#0000"/><circle cx="16" cy="56" r="5" fill="${pad}"/><circle cx="64" cy="56" r="5" fill="${pad}"/>${shape(c)}<text x="40" y="12" fill="#fff" font-size="11" text-anchor="middle" font-family="monospace">${c.ref}</text><text x="40" y="74" fill="#cfe" font-size="10" text-anchor="middle" font-family="monospace">${sh(c.req)}</text></g>`}).join('')+'</svg></div>'}
// ---------- SCREENS ----------
const R={};
const topbar=()=>UI.screen=='menu'?'':`<div class="bar"><button data-act="back">← Back</button><b>${TT[UI.screen]}</b><span class="cy">$${S.money}</span></div>${UI.msg?`<div class="msg" role="status">${UI.msg}</div>`:''}`;
const done=()=>Object.keys(S.done).filter(k=>k[0]!='b').length;
const next=()=>{for(let n=1;n<=60;n++)if(!S.done[n])return n;return 0};
R.menu=()=>`<div class="card c" style="margin-top:8vh"><h1 class="logo">⚡ ELECTRONICS<br>REPAIR SIMULATOR</h1><p class="mu">Diagnose. Replace. Test. Build your career.</p><div class="col"><button class="pri" data-act="cont">${J||done()?'Continue Career':'Start Career'}</button><button data-act="go" data-a="career">Career Mode</button><button data-act="go" data-a="tutorial">Tutorial</button><button data-act="go" data-a="settings">Settings</button></div></div>`;
R.career=()=>{const d=done(),nx=next();return`<div class="card"><h2>${RANKS[Math.min(5,Math.floor(d/10))]}</h2><p class="mu">${d} of 60 levels complete · ${S.sp} skill points</p><div class="bar2"><i style="width:${d/.6}%"></i></div><p>${d<20?'Beginner track (1–20)':d<60?'Advanced track (21–60)':'You have completed the full career.'}</p><div class="col">${J?`<button class="pri" data-act="go" data-a="job">Resume ${J.dev[0]} job</button>`:nx?`<button class="pri" data-act="start" data-a="${nx}">Start level ${nx}</button>`:''}<button data-act="go" data-a="levels">Select level</button><button data-act="go" data-a="workshop">Workshop</button></div></div>`};
R.workshop=()=>`<div class="bench"><svg viewBox="0 0 360 90" width="100%"><rect x="10" y="40" width="340" height="40" rx="4" fill="#2a2f35"/><rect x="30" y="20" width="60" height="30" fill="#0e6f7a"/><path d="M40 35h40" stroke="#7ff" stroke-width="2"/><circle cx="150" cy="50" r="14" fill="#444" stroke="#999"/><rect x="200" y="30" width="110" height="22" fill="#1c6a42"/><path d="M320 80l20-50" stroke="#ff9a2e" stroke-width="5"/></svg></div><div class="grid" style="margin-top:10px">${[['levels','📋 Levels'],['job','🔧 '+(J?'Resume job':'Repair job')],['inventory','🧰 Inventory'],['shop','🛒 Shop'],['skills','⭐ Skills'],['history','📜 History'],['career','🏆 Career'],['settings','⚙ Settings'],['tutorial','❓ Tutorial']].map(([s,t])=>`<button data-act="go" data-a="${s}">${t}</button>`).join('')}</div>`;
R.levels=()=>{let h=J?`<div class="msg">Job in progress: ${J.dev[0]}. <button data-act="go" data-a="job">Resume</button></div>`:'';
 [['Beginner · levels 1–20',1,20],['Advanced · levels 21–60',21,60]].forEach(([t,a,b])=>{h+=`<h3>${t}</h3><div class="grid lg">`;for(let n=a;n<=b;n++){const d=S.done[n],u=n==1||S.done[n-1];h+=`<button class="${d?'ok':''}" ${u?'':'disabled'} data-act="start" data-a="${n}">${n}<br><small>${d?'★'.repeat(d):u?'open':'locked'}</small></button>`}h+='</div>'});
 h+='<h3>Optional bonus jobs</h3><div class="grid lg">'+[10,20,30,40,50].map(n=>{const d=S.done['b'+n];return`<button class="${d?'ok':''}" ${S.done[n]?'':'disabled'} data-act="start" data-a="b${n}">B${n}<br><small>${d?'★'.repeat(d):S.done[n]?'open':'locked'}</small></button>`}).join('')+'</div>';return h};
R.job=()=>{if(!J)return`<div class="card c"><p>No active job.</p><button class="pri" data-act="go" data-a="levels">Pick a level</button></div>`;
 const t=UI.tab,c=gc(UI.sel),H={inspect:'Tap a part to examine it. Scorched, domed, or blackened parts are suspects, but not every fault shows.',diag:'Tap a part to probe it. Compare the reading with the value printed under the part.',fix:'Select a part, desolder it, then fit the correct part from your inventory. Cold joints need reflowing.',test:'Power on only when you think every fault is fixed.'}[t];
 let p='';
 if(t=='inspect')p=c?`<b>${c.ref}</b> (board spec ${sh(c.req)})<br>Fitted: ${c.has?P[c.has][0]:'nothing'}<br>${look(c)}`:'Select a component on the board.';
 if(t=='diag'){p=`<div class="lcd">${UI.lcd||'Multimeter ready. Tap a component to probe it.'}</div><table>${J.comps.filter(x=>J.log[x.ref]).map(x=>`<tr><td><b>${x.ref}</b> ${sh(x.req)}</td><td>${J.log[x.ref]}</td></tr>`).join('')}</table>`}
 if(t=='fix'){if(!c)p='Select a component on the board.';else{const own=Object.keys(S.inv).filter(k=>S.inv[k]>0&&P[k][2]==c.type);
  p=`<b>${c.ref}</b> needs ${P[c.req][0]}. Fitted: ${c.has?P[c.has][0]:'empty'}<div class="col" style="margin-top:8px">${c.has?`<button data-act="rm" data-a="${c.ref}">Desolder and remove</button><button data-act="reflow" data-a="${c.ref}">Reflow joints</button>`:own.map(k=>`<button class="pri" data-act="inst" data-a="${c.ref}|${k}">Fit ${P[k][0]} (×${S.inv[k]})</button>`).join('')||'<span class="or">No matching parts in inventory. Buy one in the shop.</span>'}</div>`}}
 if(t=='test'){const r=UI.res;p=`<p><span class="led ${UI.busy?'o':r?(r.ok?'g':'r'):''}"></span>${UI.busy?'Powering on…':r?(r.ok?'All checks passed':'Test failed'):'Device is off'}</p>${r&&!r.ok?`<ul>${r.f.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<div class="col"><button class="pri" data-act="test" ${UI.busy?'disabled':''}>Power on and run test</button><button class="dg" data-act="quit">Give up job ($10 fee)</button></div>`}
 return`<div class="card"><b>${J.bonus?'Bonus ':'Level '}${J.lv}: ${J.dev[0]}</b><br><span class="mu">Customer says it ${J.dev[1]}. Mistakes: ${J.mist}</span></div><div class="row">${[['inspect','1 Inspect'],['diag','2 Diagnose'],['fix','3 Repair'],['test','4 Test']].map(([k,l])=>`<button class="tab ${t==k?'on':''}" data-act="tab" data-a="${k}">${l}</button>`).join('')}</div><div style="margin-top:8px">${board()}</div>${S.set.hint?`<p class="mu">💡 ${H}</p>`:''}<div class="card">${p}</div>`};
R.inventory=()=>{const k=Object.keys(S.inv).filter(x=>S.inv[x]>0);return`<div class="card">${k.length?`<table>${k.map(x=>`<tr><td>${P[x][0]}</td><td>×${S.inv[x]}</td></tr>`).join('')}</table>`:'<p>Your parts bin is empty. Buy components in the shop.</p>'}<button data-act="go" data-a="shop">Open shop</button></div>`};
const price=k=>Math.max(1,Math.round(P[k][1]*(1-.1*(S.sk.haggle||0))));
R.shop=()=>`<div class="card"><table>${Object.keys(P).map(k=>`<tr><td>${P[k][0]}<br><small class="mu">owned ${S.inv[k]||0}</small></td><td><button data-act="buy" data-a="${k}" ${S.money<price(k)?'disabled':''}>Buy $${price(k)}</button></td></tr>`).join('')}</table></div>`;
R.skills=()=>`<p class="cy">Skill points: ${S.sp}. Earn one per new level and one more for a 3-star repair.</p>`+Object.keys(SK).map(k=>{const r=S.sk[k]||0,m=SK[k][1];return`<div class="card"><b>${SK[k][0]}</b> <span class="mu">rank ${r}/${m}</span><p>${SK[k][2]}</p><button data-act="skill" data-a="${k}" ${S.sp<1||r>=m?'disabled':''}>${r>=m?'Maxed':'Upgrade (1 point)'}</button></div>`}).join('');
R.history=()=>`<div class="card">${S.hist.length?`<table>${S.hist.map(h=>`<tr><td>${h.n}<br><small class="mu">${h.d} · ${h.t}</small></td><td class="${h.win?'gn':'rd'}">${h.win?'★'.repeat(h.stars)+' +$'+h.earn:'Failed −$10'}</td></tr>`).join('')}</table>`:'<p>No repairs yet.</p>'}</div>`;
R.settings=()=>`<div class="card col"><button data-act="snd">Sound: ${S.set.snd?'on':'off'}</button><button data-act="hint">Hints: ${S.set.hint?'on':'off'}</button><button class="dg" data-act="reset">Erase all progress</button></div>`;
R.tutorial=()=>{S.tut=1;return`<div class="card"><h3>How a repair works</h3><ol><li><b>Inspect:</b> look for burnt, domed, or blackened parts.</li><li><b>Diagnose:</b> probe parts with the multimeter. Compare each reading with the value printed under the part. Hidden faults like shorted diodes only show up here.</li><li><b>Shop:</b> buy the exact replacement part. A wrong value counts as a mistake.</li><li><b>Repair:</b> desolder the bad part, then fit the new one. Cold joints are fixed by reflowing.</li><li><b>Test:</b> power on. Symptoms in the report come from the faults still on the board. Shorts trip protection and cost money.</li></ol><p>Fewer mistakes mean more stars and more pay. Levels unlock in order. Bonus jobs appear after levels 10, 20, 30, 40 and 50.</p><p class="mu">Keyboard: 1–4 switch tabs, Tab and Enter select parts, Esc goes back.</p><button class="pri" data-act="go" data-a="workshop">Go to the workshop</button></div>`};
R.result=()=>{const d=UI.done;if(!d)return'';const n=next();return`<div class="card c"><h2 class="gn">Repair complete</h2><p style="font-size:28px">${'★'.repeat(d.st)}${'☆'.repeat(3-d.st)}</p><p>Paid <b class="gn">$${d.earn}</b>${d.sp?` · +${d.sp} skill point${d.sp>1?'s':''}`:''}</p><div class="col">${n&&!d.bonus?`<button class="pri" data-act="start" data-a="${n}">Next: level ${n}</button>`:''}<button data-act="go" data-a="levels">Levels</button><button data-act="go" data-a="workshop">Workshop</button></div></div>`};

const A={};
function render(){save();paint(1);window.scrollTo(0,0)}
function redraw(){save();paint(0)}
function go(s){UI.screen=s;UI.msg='';render()}
A.go=go;A.cont=()=>go(S.tut?'workshop':'tutorial');
A.back=()=>go(UI.screen=='menu'?'menu':UI.screen=='workshop'?'menu':'workshop');
A.tab=t=>{UI.tab=t;UI.msg='';redraw()};
A.pick=ref=>{const c=gc(ref);UI.sel=ref;UI.msg='';if(UI.tab=='diag'&&c){const r=read(c);J.log[ref]=r;UI.lcd=ref+': '+r+(S.sk.data?'  (expected '+expect(c)+')':'');beep(520,.06)}redraw()};
A.rm=ref=>{const c=gc(ref);if(!c.has)return;if(c.mode)UI.msg='Removed the faulty '+P[c.has][0]+'. It was scrapped.';else{S.inv[c.has]=(S.inv[c.has]||0)+1;UI.msg='Removed '+P[c.has][0]+'. The good part went back to inventory.'}c.has=null;c.mode=null;c.cold=false;c.dirt=false;c.jump=false;UI.res=null;beep(300);redraw()};
A.reflow=ref=>{const c=gc(ref);UI.msg=c.cold?'Reflowed: the joints are shiny and solid.':'The joints were already fine.';c.cold=false;UI.res=null;beep(400);redraw()};
A.inst=a=>{const[ref,k]=a.split('|'),c=gc(ref);if(!S.inv[k]||c.has)return;S.inv[k]--;c.has=k;c.mode=null;c.cold=false;c.dirt=false;c.jump=false;UI.res=null;
 if(k!==c.req){J.mist++;UI.msg='Fitted '+P[k][0]+', but the board calls for '+sh(c.req)+'. Mistake recorded.';beep(150)}else{UI.msg='Fitted '+P[k][0]+'.';beep(600)}redraw()};
A.buy=k=>{const c=price(k);if(S.money<c)return;S.money-=c;S.inv[k]=(S.inv[k]||0)+1;UI.msg='Bought '+P[k][0]+'.';beep(660);redraw()};
A.skill=k=>{if(S.sp<1||(S.sk[k]||0)>=SK[k][1])return;S.sp--;S.sk[k]=(S.sk[k]||0)+1;render()};
A.snd=()=>{S.set.snd=!S.set.snd;render()};A.hint=()=>{S.set.hint=!S.set.hint;render()};
A.reset=()=>{if(confirm('Erase all progress?')){localStorage.removeItem(SAVE);S=def();J=null;go('menu')}};
function hist(j,win,earn,st){S.hist.unshift({n:({f:'Free ',p:'Practice ',c:'Challenge '}[j.mode]||(j.bonus?'Bonus ':'Level '))+j.lv,d:j.dev[0],win,earn,stars:st,t:new Date().toLocaleDateString()});S.hist.length=Math.min(S.hist.length,60)}
A.start=id=>{if(J&&J.id==id){go('job');return}if(J){if(!confirm('Abandon the current job? ($10 fee)'))return;S.money=Math.max(0,S.money-10);hist(J,false,0,0)}
 J=mk(id);UI.tab='inspect';UI.sel=null;UI.res=null;UI.lcd='';go('job')};
A.quit=()=>{if(!confirm('Give up this job? ($10 fee)'))return;S.money=Math.max(0,S.money-10);hist(J,false,0,0);J=null;go('levels')};
A.test=()=>{UI.busy=1;UI.res=null;redraw();setTimeout(()=>{if(!J)return;const f=[];let tr=0;
 J.comps.forEach(c=>{if(!c.has)f.push('Missing part at '+c.ref);else{if(c.has!==c.req)f.push('Wrong part at '+c.ref+': needs '+sh(c.req));if(c.mode)f.push(SYM[c.mode]+' ('+c.ref+')');if(c.mode=='short')tr=1;if(c.cold)f.push('Intermittent contact at '+c.ref)}});
 UI.busy=0;UI.res={f,ok:!f.length};if(tr){S.money=Math.max(0,S.money-25);J.mist++;UI.msg='Protection tripped on a short. Repair bill: $25.'}
 beep(UI.res.ok?880:180,.3);if(UI.res.ok)win();else redraw()},900)};
function winOld(){const st=J.mist==0?3:J.mist<=2?2:1,prev=S.done[J.id]||0,e=Math.round((60+J.lv*12)*(J.bonus?1.5:1)*(1+.1*(S.sk.pay||0))*[0,1,1.1,1.25][st]);
 let sp=0;if(!prev)sp++;if(st==3&&prev<3)sp++;S.sp+=sp;S.money+=e;S.done[J.id]=Math.max(prev,st);hist(J,true,e,st);UI.done={st,earn:e,sp,bonus:J.bonus};J=null;go('result')}

// ---------- 2. Fault knowledge base: [name, cause, how to find it, repair, lesson] ----------
const KB={
open:['Blown fuse','A fuse opens when current exceeds its rating, or after a surge. Nothing after it gets power.','Measure DC volts before and after the fuse: voltage before, none after. With power off, resistance reads OL.','Replace it with a fuse of exactly the same current rating.','Always replace a fuse with the same rating, and ask what made it blow.'],
bulge:['Bulged capacitor','Heat, age or over-voltage made the electrolytic swell.','Look at the top of the can: it is domed. The supply shows heavy ripple on AC volts or the scope.','Replace it with the same capacitance and an equal or higher voltage rating, polarity correct.','A domed electrolytic is already failed: it can no longer smooth the supply.'],
leaky:['Leaky capacitor','The electrolyte has leaked or dried, so it filters less.','The rail carries ripple (AC volts or scope) and there may be brown residue around the base.','Replace it, matching capacitance, voltage rating and polarity.','Failing capacitors cause hum, flicker and resets before they fail completely.'],
burnt:['Burnt resistor','Overheating burnt the resistive element open.','Resistance reads OL and the body is dark. The path it fed is dead.','Replace it with the same value.','A resistor that burnt out was carrying too much power: check what draws the current.'],
drift:['Drifted resistor','Heat changed its value, so the circuit is biased wrongly.','Resistance reads far from the colour-band value.','Replace it with the same value and tolerance.','Resistors set currents and voltages: a wrong value shifts the whole circuit.'],
short:['Shorted diode','The junction failed and now conducts both ways.','Diode test reads 0.000 V in both directions. The supply draws too much current.','Replace it with the same type, cathode band matching the silkscreen.','A shorted diode lets current flow where it should be blocked.'],
dopen:['Open diode','The junction failed open and blocks current.','Diode test reads OL both ways. The voltage after it is missing.','Replace it with the same type.','Diodes should pass about 0.6 V forward and block in reverse.'],
dead:['Dead regulator or IC','The silicon failed from heat, overload or a surge.','Input voltage is present but there is no output, or no activity on the scope.','Replace it with the exact part, pin 1 aligned.','Always check the input and output of a regulator before blaming it.'],
edry:['Dried-out electrolytic','Age and heat evaporated the electrolyte, so capacitance fell and ESR rose.','The rail shows ripple on AC volts or the scope.','Replace it with the same capacitance, an equal or higher voltage rating, polarity correct.','Heat ages electrolytic capacitors. Ripple on a supply points to them first.'],
ebulge:['Vented electrolytic','Over-voltage, heat or reverse polarity made it vent.','The can top is domed or split, with brown residue. Ripple is high.','Replace it, checking voltage rating and polarity.','The + mark and the stripe tell you the polarity: reversing it can make a capacitor burst.'],
ccrack:['Cracked ceramic capacitor','Board flexing cracked the ceramic body, so it lost capacitance.','Noise appears on the rail on the scope, and a hairline crack may be visible.','Replace it with the same value.','Ceramic capacitors are brittle. Bending a board can crack them.'],
ledopen:['Open LED','The LED die or bond wire failed, so no current flows.','The LED stays dark even though voltage reaches it. Diode test shows OL.','Replace it with a compatible LED, anode on the + side.','An LED passes current one way only, so polarity matters.'],
zshort:['Shorted zener','The junction shorted and pulls the rail to ground.','The rail voltage collapses and the resistance across the zener reads near zero.','Replace it with the same zener voltage.','A zener clamps a rail to a fixed voltage; shorted, it clamps it to nothing.'],
mshort:['Shorted MOSFET','Drain and source are shorted, usually from overload or heat.','Resistance from drain to source is near zero and the supply trips on overcurrent.','Replace it with the same channel type and rating.','A shorted switch cannot turn the load off, so current never stops.'],
mgate:['Damaged MOSFET gate','A surge or static damaged the gate, so it never switches.','Voltage reaches the drain but the load never turns on and the gate does not respond.','Replace it with the same channel type and rating.','Gates are fragile: static discharge can destroy them silently.'],
iopen:['Open inductor','The winding broke, so no current passes.','Resistance reads OL where it should be a few ohms or less.','Replace it with the same inductance.','Inductors are coils of wire: a broken coil is an open circuit.'],
xopen:['Open transformer winding','A winding wire broke inside the transformer.','No secondary AC voltage appears and the winding resistance reads OL.','Replace the transformer with the same voltage rating.','Transformers step voltage down; no secondary output means a failed winding.'],
xburn:['Burnt transformer','Overload overheated the windings.','The body is discoloured and smells burnt. Output is low or missing.','Replace it and find the overload.','A burnt transformer means something downstream drew too much current.'],
rstuck:['Stuck relay contacts','The contacts welded together from arcing.','The load stays on regardless of the control signal. Continuity beeps with the coil off.','Replace the relay with the same coil voltage and contact rating.','Relays switch large loads with a small signal; arcing wears the contacts.'],
rcoil:['Open relay coil','The coil wire broke, so the relay never clicks.','Coil resistance reads OL instead of tens of ohms. There is no click.','Replace the relay with the same coil voltage.','A relay needs a working coil to move its contacts.'],
sbroke:['Broken switch','The lever or contact broke.','Continuity does not change when the lever moves.','Replace the switch with the same type.','A switch is just a controlled gap in the circuit.'],
bdead:['Dead Li-ion cell','The cell was over-discharged or has aged out.','The battery tester shows low voltage or very high internal resistance.','Replace the cell with the same chemistry and voltage.','Never charge a deeply discharged Li-ion cell. Replace it.'],
bswell:['Swollen Li-ion cell','Gas from ageing or overcharge puffed the cell.','The pack is visibly bulged. The cell is dangerous.','Replace it. Never puncture or heat a swollen cell.','A swollen Li-ion cell can ignite. Treat it as a hazard.'],
bwire:['Broken battery lead','A solder joint or wire at the battery broke.','The cell tests fine on its own, yet no voltage reaches the board.','Re-solder or reconnect the lead.','Many "dead battery" faults are only a broken wire.'],
cbent:['Bent connector pins','Pins bent or pushed back, so contact is poor.','Continuity across the connector fails and a pin looks crooked.','Replace the connector.','Connectors take mechanical abuse, so they fail more often than chips.'],
cloose:['Loose connector','The ribbon or cable is not fully seated.','Intermittent continuity: the reading changes when the cable moves.','Re-seat the cable and lock it.','Re-seat connectors before replacing parts: it costs nothing.'],
ubent:['Damaged USB port','The port shell or pins were bent by a hard plug-in or a yank.','The USB tester shows no VBUS at the port even with a good cable.','Replace the port.','USB ports take mechanical stress and are a common repair.'],
cdead:['Dead charging IC','The charge controller failed from a surge or heat.','There is input voltage but the battery never receives charge.','Replace it, pin 1 aligned.','Charging ICs sit between a USB port and a Li-ion cell, so they take surges.'],
mdead:['Dead microcontroller','The chip failed from a surge, heat or static.','The oscillator runs, yet nothing toggles on the chip pins.','Replace it with the exact part, pin 1 aligned.','If the power and clock are good but nothing runs, suspect the chip.'],
spkopen:['Open speaker coil','The voice coil wire broke.','Resistance reads OL. A working speaker reads close to its rated impedance.','Replace the speaker with the same impedance.','A speaker is a coil: broken means silent.'],
spkwire:['Broken speaker lead','The thin lead wire broke near the terminal.','The speaker coil measures fine, yet no signal reaches it.','Re-solder the lead.','Fine wires break at flexing points.'],
micdead:['Dead microphone','The electret capsule failed.','There is no signal and the capsule does not respond to sound.','Replace it, polarity correct.','Electret microphones need bias and polarity.'],

 return`<div class="card"><h2>${esc(S.name||'Technician')}</h2><p class="mu">${RANKS[Math.min(5,Math.floor(done()/10))]} · Level ${plv()}</p><div class="bar2"><i style="width:${Math.round(xp/150*100)}%"></i></div><p class="mu">${xp} / 150 XP to the next level</p><div class="kv"><b>Money</b><span>$${S.money}</span><b>Reputation</b><span>${S.rep}</span><b>Levels cleared</b><span>${done()} of 60</span><b>Stars earned</b><span>${stars}</span><b>Repairs finished</b><span>${wins}</span><b>Skill points</b><span>${S.sp}</span></div><div class="col" style="margin-top:10px"><label class="mu" for="pn">Your name</label><input id="pn" maxlength="16" value="${esc(S.name||'')}" placeholder="Technician"><button data-act="pname">Save name</button></div></div><div class="card"><h3>Tool unlocks</h3><div class="pts">${tools}</div><p class="mu">The thermal camera unlocks after 20 levels and the oscilloscope after 30.</p></div><div class="card"><h3>Skills</h3>${Object.keys(SK).map(k=>`<div class="row"><span style="flex:3">${esc(SK[k][0])}</span><b>${S.sk[k]||0}/${SK[k][1]}</b></div>`).join('')}<button data-act="go" data-a="skills">Open the skill tree</button></div>`};
TT.profile='Player Profile';TT.safety='Safety Briefing';
A.pname=()=>{const e=$('#pn');if(e){S.name=e.value.trim().slice(0,16);UI.msg='Name saved.';redraw()}};
const SAFE=[['ESD protection','Static electricity from your body can destroy chips, MOSFETs and displays without any visible sign.','Wear an ESD strap. If you turn it off and handle a sensitive part, that part may be damaged.'],['Battery polarity and Li-ion safety','Reversing a battery makes a short circuit. A swollen or punctured Li-ion cell can catch fire.','A reversed battery trips protection and ruins the cell. Swollen cells must be replaced, never heated or punctured.'],['Capacitor polarity and discharge','Electrolytic capacitors have a + side. Reversed or over-voltage, they vent. Large ones keep a charge after unplugging.','A reversed or under-rated electrolytic vents on power-up. Mains devices ask you to discharge capacitors first.'],['Current limiting','A current limit stops a fault from drawing damaging current while you diagnose.','The bench supply has a current limit. Start low (0.25 A to 0.5 A) so a short cannot burn parts.'],['Short-circuit risks','A short lets huge current flow, heating wires and parts within seconds.','A shorted part trips the supply or the protection and costs you a repair bill. Measure resistance with power off first.'],['Safe low-voltage testing','Test on the bench supply at the board rating instead of live mains.','All boards here run on the bench supply at low voltage.'],['Mains voltage hazards','Mains voltage can kill. Never open or probe a mains-powered device unless trained, and always unplug it.','Mains devices need the unplugged and discharged checklist before the case opens. This game never uses real mains.'],['Soldering safety','A soldering iron burns skin and its fumes irritate lungs.','Hold to heat only as long as needed. Too much heat damages parts, and a cold joint fails later.']];
R.safety=()=>`<div class="card"><h2>Safety briefing</h2><p class="mu">Everything in this game is simulated. Dangerous real-world work needs training and proper equipment.</p></div>${SAFE.map(s=>`<details class="card"><summary><b>${s[0]}</b></summary><p><b>In real life:</b> ${s[1]}</p><p><b>In this game:</b> ${s[2]}</p></details>`).join('')}`;
{const m0=R.menu;R.menu=function(){return m0().replace(/<button[^>]*data-act="go" data-a="settings">/,x=>`<button class="" data-act="go" data-a="profile">👤<span>Player Profile</span></button><button class="" data-act="go" data-a="safety">🦺<span>Safety Briefing</span></button>`+x)}}
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:`

`}));
